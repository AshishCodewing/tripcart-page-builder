name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Points at the throwaway `postgres` service below. `prisma generate`
      # only needs the var to exist; `migrate deploy` + the integration suite
      # actually connect. pgvector image: an init migration CREATEs the vector
      # extension (RAG tables), so stock postgres can't apply the schema.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # package.json has no `packageManager` field, so the action needs
          # an explicit version (keep in sync with the major used locally).
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      - run: pnpm test:integration